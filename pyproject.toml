[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dao-terminal"
version = "0.15.0"
description = "Branchable, record-based adjudication in ordinary language"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dao = "dao.cli:main"

[tool.setuptools.packages.find]
include = ["dao*"]
