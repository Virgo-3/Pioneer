[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pioneer-terminal"
version = "0.1.0"
description = "A branchable conversational AI terminal with explicit decision analysis"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pioneer = "pioneer.cli:main"

[tool.setuptools.packages.find]
include = ["pioneer*"]
