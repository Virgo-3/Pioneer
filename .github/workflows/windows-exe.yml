name: Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Install builder
        run: python -m pip install pyinstaller==6.22.3
      - name: Build
        run: python -m PyInstaller --clean --noconfirm --onefile --console --name Dao launcher.py
      - name: Smoke test executable
        shell: pwsh
        run: |
          & .\dist\Dao.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'dao-smoke-local'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'dao-smoke-roaming'
          $env:OPENAI_API_KEY = 'smoke-test-no-network-call'
          '/exit' | & .\dist\Dao.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Dao\workspace\.dao\HEAD'))) {
            throw 'Double-click launch did not initialize the workspace.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Dao-Windows
          path: dist/Dao.exe
          if-no-files-found: error
      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $body = @{
            tag_name = $tag
            name = "Dao $tag"
            body = 'Download Dao.exe and double click it. On first launch, paste your OpenAI API key or press Enter for offline decision tools.'
            draft = $true
            prerelease = $false
          } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/releases" -Headers $headers -ContentType 'application/json' -Body $body
          Invoke-RestMethod -Method Post -Uri "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=Dao.exe" -Headers $headers -ContentType 'application/octet-stream' -InFile 'dist/Dao.exe' | Out-Null
          $publish = @{ draft = $false } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$repo/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body $publish | Out-Null
